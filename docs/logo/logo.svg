<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2d2a33"/>
      <stop offset="75%" stop-color="#141218"/>
      <stop offset="100%" stop-color="#08070a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2b8"/>
      <stop offset="35%" stop-color="#f0c55a"/>
      <stop offset="70%" stop-color="#b8821f"/>
      <stop offset="100%" stop-color="#7a520e"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeaa0"/>
      <stop offset="50%" stop-color="#d9a640"/>
      <stop offset="100%" stop-color="#8a5c12"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b3a22"/>
      <stop offset="55%" stop-color="#5e2414"/>
      <stop offset="100%" stop-color="#3a140a"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e0f07"/>
      <stop offset="45%" stop-color="#6e2c18"/>
      <stop offset="100%" stop-color="#3e170b"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d6a8"/>
      <stop offset="100%" stop-color="#b99a62"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf3d0"/>
      <stop offset="45%" stop-color="#e2b54e"/>
      <stop offset="100%" stop-color="#8f6114"/>
    </linearGradient>
    <radialGradient id="medal" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a1c10"/>
      <stop offset="100%" stop-color="#220a04"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#000" opacity="0.18"/>
      <circle cx="4" cy="4" r="0.6" fill="#fff" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="#08070a"/>
  <rect width="400" height="400" rx="56" fill="url(#bg)"/>
  <rect x="9" y="9" width="382" height="382" rx="48" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- Libro cerrado, grueso, un poco girado -->
  <g filter="url(#shadow)" transform="rotate(-6 200 200)">
    <!-- Canto de las páginas (derecha y abajo) -->
    <path d="M110 70 L312 70 Q326 70 326 84 L326 322 Q326 336 312 336 L110 336 Z" fill="url(#pages)" stroke="#6b4a1e" stroke-width="2"/>
    <g stroke="#9c7c46" stroke-width="1.2" opacity="0.8">
      <path d="M314 78 L314 328"/><path d="M318 80 L318 326"/><path d="M322 84 L322 322"/>
    </g>
    <!-- Tapa -->
    <rect x="86" y="58" width="222" height="270" rx="12" fill="url(#cover)" stroke="#240a04" stroke-width="3"/>
    <rect x="86" y="58" width="222" height="270" rx="12" fill="url(#grain)"/>
    <!-- Lomo -->
    <rect x="76" y="54" width="34" height="278" rx="10" fill="url(#spine)" stroke="#1e0703" stroke-width="3"/>
    <g fill="url(#goldV)" stroke="#5a3a0c" stroke-width="1.2">
      <rect x="74" y="88" width="38" height="9" rx="3"/>
      <rect x="74" y="190" width="38" height="9" rx="3"/>
      <rect x="74" y="292" width="38" height="9" rx="3"/>
    </g>
    <!-- Marco dorado de la tapa -->
    <rect x="114" y="78" width="176" height="230" rx="8" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <rect x="124" y="88" width="156" height="210" rx="5" fill="none" stroke="#e8b850" stroke-opacity="0.45" stroke-width="2"/>
    <!-- Esquinas de metal -->
    <g fill="url(#gold)" stroke="#5a3a0c" stroke-width="2">
      <path d="M300 60 L308 60 Q308 60 308 68 L308 104 L290 86 L272 68 Z"/>
      <path d="M300 326 L308 326 L308 318 L308 282 L290 300 L272 318 Z"/>
      <path d="M118 60 L156 60 L136 80 L112 92 L112 66 Z" opacity="0.95"/>
      <path d="M118 326 L156 326 L136 306 L112 294 L112 320 Z" opacity="0.95"/>
    </g>
    <g fill="#fff3c0" opacity="0.8">
      <circle cx="298" cy="72" r="2.4"/><circle cx="298" cy="314" r="2.4"/>
      <circle cx="124" cy="70" r="2.4"/><circle cx="124" cy="316" r="2.4"/>
    </g>
    <!-- Broche -->
    <rect x="296" y="176" width="34" height="34" rx="6" fill="url(#gold)" stroke="#5a3a0c" stroke-width="2"/>
    <rect x="306" y="186" width="14" height="14" rx="3" fill="#3a1a08"/>

    <!-- Medallón central con el martillo en relieve -->
    <circle cx="202" cy="193" r="66" fill="url(#gold)" stroke="#5a3a0c" stroke-width="3"/>
    <circle cx="202" cy="193" r="55" fill="url(#medal)" stroke="#f3cf6a" stroke-width="2"/>
    <g filter="url(#emboss)" transform="rotate(-40 202 193)">
      <!-- Mango -->
      <rect x="196" y="176" width="12" height="74" rx="5" fill="url(#steel)" stroke="#4a300a" stroke-width="1.5"/>
      <rect x="194" y="236" width="16" height="9" rx="3" fill="#fff0b0" stroke="#4a300a" stroke-width="1.2"/>
      <!-- Cabeza -->
      <path d="M168 150 L236 150 Q242 150 242 156 L242 176 Q242 182 236 182 L168 182 Q162 182 162 176 L162 156 Q162 150 168 150 Z" fill="url(#steel)" stroke="#4a300a" stroke-width="2"/>
      <rect x="162" y="150" width="12" height="32" rx="4" fill="#fff3c8" stroke="#4a300a" stroke-width="1.5"/>
      <rect x="230" y="150" width="12" height="32" rx="4" fill="#fff3c8" stroke="#4a300a" stroke-width="1.5"/>
      <path d="M178 156 L226 156" stroke="#fff8dc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
    <!-- Brillos del medallón -->
    <g fill="#fff6cc">
      <path d="M202 127 l3 7 7 1 -5 4 2 7 -7 -4 -7 4 2 -7 -5 -4 7 -1z" opacity="0.9"/>
    </g>
  </g>
</svg>
