# Publica en CurseForge al crear una etiqueta de versión (por ejemplo v1.0.0).
#
# Necesita en GitHub (Settings > Secrets and variables > Actions):
#   CF_API_KEY: token de la API de CurseForge (https://authors.curseforge.com/account/api-tokens)
# y en CraftersJournal.toc la línea  ## X-Curse-Project-ID: <número del proyecto>
#
# El empaquetador (BigWigsMods/packager) arma el zip según .pkgmeta, comenta los
# bloques --@debug@ (la versión de los jugadores, sin el modo desarrollo) y lo sube
# con las notas de CHANGELOG.md. La versión de juego es la de WoW Forever (1.60.1).
name: Publicar en CurseForge

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        with:
          args: -g 1.60.1
